# CI：push main / pull_request 触发；pnpm 版本与 wechat 仓 release.yml 对齐（11.23.0）。
#
# 顺序说明：pnpm check 含 build；test/ 单测 import ../lib/index.js，必须跑在 build 之后。

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check (typecheck + build)
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Verify package
        run: node scripts/verify-package.mjs
